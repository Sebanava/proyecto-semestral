server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: peliculas_route
          uri: http://localhost:8081
          predicates:
            - Path=/api/peliculas/**
          filters:
            - StripPrefix=1

        - id: clientes_route
          uri: http://localhost:8082
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=1

        - id: login_route
          uri: http://localhost:8083
          predicates:
            - Path=/api/usuario/**
          filters:
            - StripPrefix=1

        - id: rental_route
          uri: http://localhost:8084
          predicates:
            - Path=/api/rental/**
          filters:
            - StripPrefix=1

        - id: pago_route
          uri: http://localhost:8085
          predicates:
            - Path=/api/pago/**
          filters:
            - StripPrefix=1

        - id: inventario_route
          uri: http://localhost:8086
          predicates:
            - Path=/api/inventario/**
          filters:
            - StripPrefix=1

        - id: alertas_route
          uri: http://localhost:8087
          predicates:
            - Path=/api/alertas/**
          filters:
            - StripPrefix=1

        - id: reportes_route
          uri: http://localhost:8088
          predicates:
            - Path=/api/reportes/**
          filters:
            - StripPrefix=1

        - id: resenas_route
          uri: http://localhost:8089
          predicates:
            - Path=/api/resenas/**
          filters:
            - StripPrefix=1

eureka:
  client:
    enabled: false
