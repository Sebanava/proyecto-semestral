server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        ssl:
          useInsecureTrustManager: true
      routes:
        - id: peliculas_route
          uri: https://peliculas-production-a9ea.up.railway.app
          predicates:
            - Path=/api/peliculas/**
          filters:
            - StripPrefix=1

        - id: clientes_route
          uri: https://clientes-production-4a32.up.railway.app
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=1

        - id: login_route
          uri: https://login-production-42cc.up.railway.app
          predicates:
            - Path=/api/usuario/**
          filters:
            - StripPrefix=1

        - id: rental_route
          uri: https://rental-production-ac3c.up.railway.app
          predicates:
            - Path=/api/rental/**
          filters:
            - StripPrefix=1

        - id: pago_route
          uri: https://pago-production-c7d7.up.railway.app
          predicates:
            - Path=/api/pago/**
          filters:
            - StripPrefix=1

        - id: inventario_route
          uri: https://inventario-production-67d4.up.railway.app
          predicates:
            - Path=/api/inventario/**
          filters:
            - StripPrefix=1

        - id: alertas_route
          uri: https://alertas-production-e6b3.up.railway.app
          predicates:
            - Path=/api/alertas/**
          filters:
            - StripPrefix=1

        - id: reportes_route
          uri: https://reportes-production-cc61.up.railway.app
          predicates:
            - Path=/api/reportes/**
          filters:
            - StripPrefix=1

        - id: resenas_route
          uri: https://resenas-production.up.railway.app
          predicates:
            - Path=/api/resenas/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    enabled: false
