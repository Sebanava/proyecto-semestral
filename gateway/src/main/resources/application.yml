server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: peliculas_route
          uri: lb://PELICULAS
          predicates:
            - Path=/api/peliculas/**
          filters:
            - StripPrefix=1

        - id: clientes_route
          uri: lb://CLIENTES
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=1

        - id: login_route
          uri: lb://LOGIN
          predicates:
            - Path=/api/usuario/**
          filters:
            - StripPrefix=1

        - id: rental_route
          uri: lb://RENTAL
          predicates:
            - Path=/api/rental/**
          filters:
            - StripPrefix=1

        - id: pago_route
          uri: lb://PAGO
          predicates:
            - Path=/api/pago/**
          filters:
            - StripPrefix=1

        - id: inventario_route
          uri: lb://INVENTARIO
          predicates:
            - Path=/api/inventario/**
          filters:
            - StripPrefix=1

        - id: alertas_route
          uri: lb://ALERTAS
          predicates:
            - Path=/api/alertas/**
          filters:
            - StripPrefix=1

        - id: reportes_route
          uri: lb://REPORTES
          predicates:
            - Path=/api/reportes/**
          filters:
            - StripPrefix=1

        - id: resenas_route
          uri: lb://RESENAS
          predicates:
            - Path=/api/resenas/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
